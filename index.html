<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UBOA Jharkhand Portal</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002b66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #002b66 0%, #001a40 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .install-card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 20px;
      padding: 28px 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 1.5px solid #d4af37;
    }
    .crest-img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      margin-bottom: 12px;
      border-radius: 50%;
    }
    .org-title {
      font-size: 16px;
      font-weight: 800;
      color: #002b66;
    }
    .org-sub {
      font-size: 11px;
      font-weight: 700;
      color: #c8102e;
      text-transform: uppercase;
      margin-top: 2px;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      display: block;
      text-decoration: none;
      margin-top: 10px;
    }
    .btn-install {
      background: #15803d;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.25);
    }
    .btn-portal {
      background: #f1f5f9;
      color: #002b66;
      border: 1.5px solid #cbd5e1;
    }
    .features-list {
      background: #f8fafc;
      border-radius: 8px;
      padding: 10px;
      text-align: left;
      font-size: 11.5px;
      color: #475569;
      margin: 14px 0;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="install-card">
    <img src="assets/25-years-crest.png" 
         onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/13s4cgl-b9QBbhf63nedo69_MlR7V5CsV';" 
         class="crest-img" alt="UBOA Emblem">
    <h2 class="org-title">Union Bank Officers' Association</h2>
    <div class="org-sub">Jharkhand State Unit (Silver Jubilee)</div>

    <div class="features-list">
      ✓ 1-Tap Guest House Booking & Roster<br>
      ✓ Official Policy Circulars & HRMS Guidelines<br>
      ✓ Direct State Committee & Caretaker Helpline
    </div>

    <!-- Triggers Chrome Native App Install -->
    <button type="button" class="btn btn-install" id="btnInstallApp" onclick="triggerPwaInstall()">
      📲 Install App on Phone
    </button>

    <!-- Fallback Direct Portal Entry -->
    <a href="https://sites.google.com/view/uboajharkhand/home" class="btn btn-portal" id="btnContinuePortal">
      🌐 Continue in Web Browser →
    </a>
  </div>

  <script>
    const PORTAL_URL = "https://sites.google.com/view/YOUR_UBOA_SITE_PATH";
    let deferredPrompt = null;

    // 1. Register Service Worker (Mandatory for Install prompt)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    // 2. Auto-forward if user already installed and opened the app
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone) {
      window.location.replace(PORTAL_URL);
    }

    // 3. Capture the Android / Chrome App Install Prompt
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('btnInstallApp');
      if (installBtn) installBtn.style.display = 'block';
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('App install accepted');
          }
          deferredPrompt = null;
        });
      } else {
        // Fallback for browsers that don't support automated prompt (e.g. iOS Safari)
        alert("To install: Tap the browser menu (⋮ or Share icon) and select 'Add to Home screen' or 'Install App'.");
      }
    }
  </script>
</body>
</html>
