<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UBOA Jharkhand Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002b66">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #002b66; }
    
    /* Splash Screen (shows only while portal loads) */
    #splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #002b66 0%, #001a40 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    .splash-logo {
      width: 90px;
      height: 90px;
      margin-bottom: 14px;
      border-radius: 50%;
    }
    .splash-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .splash-sub {
      font-size: 11px;
      color: #fef08a;
      margin-top: 4px;
    }
    .loader {
      margin-top: 20px;
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #d4af37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* The Portal Frame */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Instant Splash with 25th Year Crest -->
  <div id="splash">
    <img src="assets/25-years-crest.png" 
         onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/13s4cgl-b9QBbhf63nedo69_MlR7V5CsV';" 
         class="splash-logo" alt="UBOA Emblem">
    <div class="splash-title">UBOA JHARKHAND</div>
    <div class="splash-sub">Silver Jubilee Edition • 1999–2026</div>
    <div class="loader"></div>
  </div>

  <!-- Embedded Live Portal -->
  <iframe 
    id="portalFrame"
    src="https://sites.google.com/view/YOUR_UBOA_SITE_PATH" 
    onload="hideSplash()"
    allow="geolocation; camera; microphone; clipboard-write">
  </iframe>

  <script>
    function hideSplash() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 400);
      }
    }

    // Safety fallback: dismiss splash after 4s even if iframe onload fires late
    setTimeout(hideSplash, 4000);
  </script>
</body>
</html>
