<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UBOA Ranchi Portal</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#002b66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UBOA Ranchi">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #002b66;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .app-card {
      background: #ffffff;
      color: #0f172a;
      width: 100%;
      max-width: 380px;
      border-radius: 20px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      background: #fee2e2;
      color: #c8102e;
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .emblem {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: #002b66;
      color: #ffffff;
      font-size: 26px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      border: 3px solid #c8102e;
    }
    h1 { font-size: 18px; font-weight: 800; color: #002b66; line-height: 1.3; margin-bottom: 4px; }
    p { font-size: 12px; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      border: none;
      margin-bottom: 10px;
    }
    .btn-install {
      background: #15803d;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(21,128,61,0.3);
    }
    .btn-open {
      background: #002b66;
      color: #ffffff;
    }
    .help-note {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="badge">UBOA Jharkhand</div>
    <div class="emblem">UBOA</div>
    <h1>UBOA-JH</h1>
    <p>Install the official association portal on your home screen for portal access, fast booking, allotment passes, and guidelines.</p>

    <!-- Native Install Trigger Button -->
    <button type="button" class="btn btn-install" id="btnInstall" onclick="installPwa()" style="display: none;">
      📲 Install App on Phone
    </button>

    <!-- Direct Navigation Button -->
    <a href="https://sites.google.com/view/uboajharkhand/home" class="btn btn-open" id="btnOpenPortal">
      🌐 Continue to Web Portal →
    </a>

    <div class="help-note" id="installHelpText">
      Or tap Chrome menu (⋮) &gt; <b>Add to Home screen</b>
    </div>
  </div>

  <script>
    var deferredPrompt;
    var btnInstall = document.getElementById('btnInstall');
    var helpText = document.getElementById('installHelpText');

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function() {
        console.log('UBOA Service Worker Active');
      });
    }

    // Capture Native Browser Install Prompt
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = 'block';
      helpText.innerText = 'Tap the green button above to install directly.';
    });

    function installPwa() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(choice) {
          if (choice.outcome === 'accepted') {
            btnInstall.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        alert("To install:\n1. Tap the three dots (⋮) in the top-right corner of Chrome.\n2. Tap 'Add to Home screen' or 'Install app'.");
      }
    }

    window.addEventListener('appinstalled', function() {
      btnInstall.style.display = 'none';
      helpText.innerText = '✅ Installed! You can now launch UBOA Ranchi from your home screen.';
    });
  </script>
</body>
</html>
