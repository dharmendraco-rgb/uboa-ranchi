<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UBOA Ranchi Portal</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#002b66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UBOA Ranchi">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #002b66; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe src="https://sites.google.com/view/uboajharkhand/home" allow="clipboard-write; geolocation"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          console.log('UBOA Service Worker active:', reg.scope);
        }).catch(function(err) {
          console.error('Service worker error:', err);
        });
      });
    }
  </script>
</body>
</html>
