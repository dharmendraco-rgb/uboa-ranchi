<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UBOA Ranchi Portal</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#002b66">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="UBOA Ranchi">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #002b66;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #ffffff;
      color: #002b66;
      font-size: 26px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      margin-bottom: 18px;
    }
    h2 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
    p { font-size: 13px; opacity: 0.85; margin-bottom: 22px; }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="logo-box">UB</div>
  <h2>UBOA Ranchi Guest House</h2>
  <p>Connecting to Official Portal...</p>
  <div class="spinner"></div>

  <script>
    var TARGET_URL = "https://sites.google.com/view/uboajharkhand/home";

    // Register service worker so the app is recognized as an installable PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function(err) {
        console.log('SW registration note:', err);
      });
    }

    // Redirect to the actual Google Sites home page seamlessly
    setTimeout(function() {
      window.location.replace(TARGET_URL);
    }, 400);
  </script>
</body>
</html>
